name: Secret scan

# gitleaks over the checked-out tree, with the allowlist in .gitleaks.toml.
#
# Blocking from day one: the tree scans clean with the current allowlist, so
# any red here is a newly committed secret. GitHub's own secret scanning is
# disabled on this repo, and the CI gates never look at credentials, so this is
# the only check that would catch a pasted token before it ships in a tarball.
#
# Runs the pinned release binary directly instead of gitleaks-action (v2 needs
# a licence key for org repos and makes API calls that fail under the default
# token) or a Docker Hub image (rate-limited). Pattern borrowed from dexaflow.
#
# Scope note: `gitleaks dir` scans the working tree, not history. A secret that
# was committed and later deleted is out of scope here — rotate it instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC — new upstream rules can flag old files
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          ok=0
          for i in 1 2 3; do
            if curl -fsSL "$url" -o "$RUNNER_TEMP/gitleaks.tgz"; then ok=1; break; fi
            echo "::warning::gitleaks download attempt ${i} failed; retrying in 5s"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::could not download gitleaks v${GITLEAKS_VERSION}"; exit 1; }
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          # `dir .` auto-loads .gitleaks.toml. --redact keeps matches out of logs.
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --exit-code 1
